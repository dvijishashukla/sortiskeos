# logstash.conf — HARDENED
# Changes from original:
#   - HTTP input on port 8080 REMOVED  (was an open data-injection door)
#   - ES output now uses credentials from env  (was unauthenticated)
#   - document_id set to prevent duplicates on Logstash restart
#   - timezone set to Asia/Kolkata for IST timestamps
#   - noise-point anomalies (cluster -1) are NOT dropped — they reach Kibana

input {
  file {
    path           => "/usr/share/logstash/collected_logs/system_logs.json"
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/.sincedb_system_logs"
    codec          => "json"
    mode           => "read"
  }
}

filter {
  # ── Normalize timestamp → IST ────────────────────────────────────────────
  date {
    match    => ["@timestamp", "ISO8601"]
    target   => "@timestamp"
    timezone => "Asia/Kolkata"           # IST = UTC+5:30
  }

  # Add a human-readable IST field alongside the stored UTC @timestamp
  ruby {
    code => '
      require "time"
      ts = event.get("@timestamp")
      if ts
        ist = ts.time.localtime("+05:30")
        event.set("timestamp_ist", ist.strftime("%Y-%m-%d %H:%M:%S IST"))
      end
    '
  }

  # ── Normalize log level ──────────────────────────────────────────────────
  mutate {
    uppercase => ["level"]
  }

  # ── Severity score ───────────────────────────────────────────────────────
  if [level] == "CRITICAL" { mutate { add_field => { "severity" => 5 } } }
  else if [level] == "ERROR"   { mutate { add_field => { "severity" => 4 } } }
  else if [level] == "WARN"    { mutate { add_field => { "severity" => 3 } } }
  else if [level] == "WARNING" { mutate { add_field => { "severity" => 3 } } }
  else if [level] == "INFO"    { mutate { add_field => { "severity" => 2 } } }
  else                         { mutate { add_field => { "severity" => 1 } } }

  # ── Suspicious keywords ──────────────────────────────────────────────────
  if [message] =~ /(?i)(shutdown|crash|panic|timeout|connection refused|failed|error|killed)/ {
    mutate { add_tag => ["suspicious"] }
  }
  if [message] =~ /(?i)(kernel panic|out of memory|oom|segfault|stack trace)/ {
    mutate { add_tag => ["critical_event"] }
  }

  # ── Stable document ID (source path + raw timestamp) ────────────────────
  # Prevents duplicate docs if Logstash restarts and re-reads the staging file.
  fingerprint {
    source        => ["source", "@timestamp", "message"]
    target        => "[@metadata][fingerprint]"
    method        => "SHA1"
    key           => "sortiskeos-dedup-key"
    base64encode  => true
  }

  mutate {
    remove_field => ["@version", "event", "log", "input"]
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    index    => "system-logs-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][fingerprint]}"   # idempotent writes
  }
  # stdout removed in production — uncomment for debugging only
  # stdout { codec => rubydebug }
}
